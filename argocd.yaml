apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shortener
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/smallestcontainer/k3d-gitops.git
    targetRevision: master
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true